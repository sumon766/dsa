<!DOCTYPE html>
<html>
    <head>
        <title>Selection Sort Algorithm Using JavaScript</title>
    </head>

    <body>
        <h2 id="selection-sort"></h2>

        <script>
            function selectionSort(array) {
                let n = array.length;

                for(let i = 0; i < n; i++) {
                    let min_index = i;

                    for(let j = i + 1; j < n; j++) {
                        if(array[j] < array[min_index]) {
                            min_index = j;
                        }
                    }

                    [array[i], array[min_index]] = [array[min_index], array[i]];
                }

                let display = document.getElementById('selection-sort');
                display.innerHTML = array.join(', ');
            }

            selectionSort([64, 34, 25, 12, 22, 11, 90, 5]);
        </script>
    </body>
</html>
