<!DOCTYPE html>
<html>
    <head>
        <title>DSA using JavaScript</title>
    </head>
    <body>
        <h2 id="sorted-array"></h2>

        <script>
            function bubbleSort(arr){
                let n = arr.length;

                for(let i = 0; i < n - 1; i++) {
                    let swapped = false;

                    for(let j = 0; j < n - i - 1; j++) {
                        if(arr[j] > arr[j + 1]) {
                            [arr[j], arr[j + 1]] = [arr[j + 1], arr[j]];
                            swapped = true;
                        }
                    }

                    if(!swapped) {
                        break;
                    }
                }

                let sortedArray = document.getElementById('sorted-array');
                sortedArray.innerHTML = arr.join(', ');
            }

            bubbleSort([64, 34, 25, 12, 22, 11, 90, 5]);
        </script>
    </body>
</html>
